
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>MEMENTO – The Passing Hours</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: #f5e6c8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { letter-spacing: 7px; font-size: 27px; margin-bottom: 4px; }
    .subtitle { color: #a99b80; letter-spacing: 3px; font-size: 11px; }
    .clock {
      width: min(78vw, 300px);
      height: min(78vw, 300px);
      border: 2px solid #b99a5b;
      border-radius: 50%;
      margin: 32px auto;
      position: relative;
      background: radial-gradient(circle, #24211b, #111);
      box-shadow: 0 0 35px #b99a5b22, inset 0 0 25px #b99a5b15;
    }
    .number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
    }
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 8px;
    }
    .hour { width: 5px; height: 75px; background: #e4c477; }
    .minute { width: 3px; height: 105px; background: #f5e6c8; }
    .second { width: 2px; height: 115px; background: #c58d45; }
    .pin {
      position: absolute; width: 12px; height: 12px;
      background: #e4c477; border-radius: 50%;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    #time { font-size: 36px; letter-spacing: 3px; }
    #date { color: #b8a98c; margin-top: 8px; }
    .progress {
      margin-top: 26px; padding: 18px;
      border: 1px solid #665638; border-radius: 14px;
      background: #1a1916;
    }
    .bar { height: 7px; background: #39352d; border-radius: 9px; margin-top: 12px; }
    #fill { height: 100%; width: 0%; background: #d5b36c; border-radius: 9px; }
    .small { color: #a99b80; font-size: 13px; margin-top: 9px; }
    footer { color: #766b57; font-size: 11px; margin-top: 28px; }
  </style>
</head>

<body>
<main>
  <h1>MEMENTO</h1>
  <div class="subtitle">THE PASSING HOURS</div>

  <div class="clock" id="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="pin"></div>
  </div>

  <div id="time">00:00:00</div>
  <div id="date"></div>

  <section class="progress">
    <strong>YOUR DAY IS PASSING</strong>
    <div class="bar"><div id="fill"></div></div>
    <div class="small" id="percent">0% of today completed</div>
  </section>

  <footer>BE PRESENT. TIME NEVER RETURNS.</footer>
</main>

<script>
  const clock = document.getElementById("clock");

  for (let i = 1; i <= 12; i++) {
    const number = document.createElement("div");
    number.className = "number";
    number.textContent = i;
    const angle = (i * 30 - 90) * Math.PI / 180;
    const radius = 125;
    number.style.left = `calc(50% + ${radius * Math.cos(angle)}px)`;
    number.style.top = `calc(50% + ${radius * Math.sin(angle)}px)`;
    number.style.color = i === new Date().getHours() % 12 || (i === 12 && new Date().getHours() % 12 === 0) ? "#f4ce78" : "#a99b80";
    clock.appendChild(number);
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    document.getElementById("hour").style.transform =
      `translateX(-50%) rotate(${(h % 12) * 30 + m * 0.5}deg)`;
    document.getElementById("minute").style.transform =
      `translateX(-50%) rotate(${m * 6 + s * 0.1}deg)`;
    document.getElementById("second").style.transform =
      `translateX(-50%) rotate(${s * 6}deg)`;

    document.getElementById("time").textContent =
      now.toLocaleTimeString("en-IN", { hour12: false });
    document.getElementById("date").textContent =
      now.toLocaleDateString("en-IN", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });

    const elapsed = h * 3600 + m * 60 + s;
    const progress = elapsed / 86400 * 100;
    document.getElementById("fill").style.width = progress + "%";
    document.getElementById("percent").textContent =
      progress.toFixed(1) + "% of today completed";
  }

  updateClock();
  setInterval(updateClock, 1000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("MEMENTO Offline Ready"))
        .catch(error => console.error("Service Worker:", error));
    });
  }
</script>
</body>
</html>
